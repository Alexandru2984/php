; Dedicated pool template. Create the php-guestbook system identity and paths first.
[php-guestbook]
user = php-guestbook
group = php-guestbook

listen = /run/php/php-guestbook.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 500

clear_env = yes
env[APP_STORAGE_DIR] = /srv/canary/php.micutu.com/php_micutu_app_storage
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 15s
security.limit_extensions = .php

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[session.save_path] = /srv/canary/php.micutu.com/sessions
php_admin_value[open_basedir] = /srv/canary/php.micutu.com:/tmp
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 10
php_admin_value[max_input_time] = 10
php_admin_value[post_max_size] = 32K
php_admin_value[upload_max_filesize] = 1K
