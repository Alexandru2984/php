# Reviewed template. Validate paths and run `nginx -t` before installation.
server {
    listen 80;
    listen [::]:80;
    server_name php.micutu.com;
    return 301 https://php.micutu.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name php.micutu.com;

    root /srv/canary/php.micutu.com/current;
    index index.php;
    client_max_body_size 32k;
    server_tokens off;

    access_log /var/log/nginx/php-canary.access.log;
    error_log /var/log/nginx/php-canary.error.log warn;

    # Defined by the managed Cloudflare origin-guard include.
    set $php_origin_allowed $from_cloudflare_origin;
    if ($php_origin_allowed = 0) {
        return 403;
    }

    ssl_certificate /etc/letsencrypt/live/php.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/php.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:php_canary_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is executable. No path-info is accepted.
    location = /index.php {
        limit_req zone=guestbook burst=15 nodelay;
        limit_req_status 429;
        include fastcgi.conf;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php-guestbook.sock;
    }
    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~* \.(?:sqlite|sqlite-wal|sqlite-shm|db|env|md|bak|log|dist|example|sh)$ {
        return 404;
    }
    location ^~ /scripts/ {
        return 404;
    }
    location ~ /\.(?!well-known) {
        return 404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        access_log off;
        log_not_found off;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # $request_id provides a per-request nonce. Cloudflare JavaScript Detection can
    # propagate CSP header nonces to its injected script; never add unsafe-inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://static.cloudflareinsights.com; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://analytics.micutu.com https://cloudflareinsights.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; manifest-src 'self'" always;
}
