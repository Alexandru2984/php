<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Micuțu Guestbook</title>
  <desc id="description">An open guestbook surrounded by friendly message cards on an indigo night background.</desc>
  <defs>
