name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            curl gzip php-cli php-mbstring php-sqlite3 php-xml shellcheck sqlite3

      - name: Run verification suite
        run: bash scripts/ci.sh

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PHP test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            php-cli php-mbstring php-sqlite3

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Install locked browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit browser test dependencies
        run: npm audit --audit-level=high

      - name: Install pinned Chromium runtime
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run responsive and accessibility browser checks
        run: npm run test:browser

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: development, runtime, unknown
          comment-summary-in-pr: never
